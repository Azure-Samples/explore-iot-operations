metadata:
  name: Align speed with historical temperature
  description: Bounded event-time alignment; publish periodic ticks to flush idle tails.
  version: "1.0.0"
  $schema: "https://www.schemastore.org/aio-wasm-graph-config-1.1.0.json"
  vendor: Azure Samples
moduleRequirements:
  apiVersion: "1.1.0"
  runtimeVersion: "1.1.0"
moduleConfigurations:
  - name: patterns
    parameters:
      settings:
        name: settings
        description: Complete JSON settings; role must remain align-by-time.
        default: '{"role":"align-by-time"}'
operations:
  - operationType: source
    name: input
    arity: 1
  - operationType: map
    name: patterns
    module: azure-samples/explore-iot-operations/dataflow-patterns/module-dataflow-patterns:1.0.0
  - operationType: filter
    name: suppress-internal
    module: azure-samples/explore-iot-operations/dataflow-patterns/module-dataflow-patterns:1.0.0
  - operationType: sink
    name: output
    arity: 1
connections:
  - from: { name: input }
    to: { name: patterns }
  - from: { name: patterns }
    to: { name: suppress-internal }
  - from: { name: suppress-internal }
    to: { name: output }
