[project]
name = "onvif-simulator"
version = "0.1.0"
description = "Containerized ONVIF camera simulator for Azure IoT Operations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11.0,<4",
    "av>=14.0.0,<16",
    "lxml>=5.3.0,<6",
    "pillow>=11.0.0,<12",
    "pydantic-settings>=2.7.0,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
onvif-simulator = "onvif_simulator.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0,<2",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<1",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onvif_simulator"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",
    "S104", # Network services intentionally bind configured or wildcard addresses.
    "S105", # ONVIF names many non-secret protocol fields "password" and "token".
    "S106",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["onvif_simulator"]
ignore_missing_imports = true
