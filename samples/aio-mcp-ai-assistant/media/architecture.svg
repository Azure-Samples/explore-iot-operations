<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1244" viewBox="0 0 1280 1244"
     font-family="'Segoe UI', 'Segoe UI Web (West European)', -apple-system, 'Helvetica Neue', Arial, sans-serif"
     role="img" aria-labelledby="title description">
  <title id="title">AIO MCP and AI assistant: runtime architecture</title>
  <desc id="description">An operator outside the edge cluster uses authenticated kubectl exec to ask questions, inspect tools, and approve or deny recommendations. The single-container agent validates calls, holds publication for approval, and calls a Foundry Local Qwen text model. All AIO tools go through the built-in HTTPS MCP frontend and platform backend, which owns resource reads and broker connections. There is no custom MCP server, sidecar, or agent broker token. The AIO MQTT broker receives observation JSON from a separate producer and delivers approved recommendation JSON to a separate consumer. Optional camera-control data flow graphs receive JSON requests and run custom WASM transforms that invoke ONVIF managed actions through the same broker. The connector for ONVIF exchanges MQTT RPC with that broker and calls the software camera over SOAP and HTTP. Three independent DataflowGraph resources handle GetStatus, ContinuousMove, and Stop. The simulator uses a synthetic scene and is not automatically connected to a media or vision pipeline. Dashed outlines mark optional integrations; actions are opt-in. The model receives text and JSON, not images. This is a source-defined runtime overview, not a live deployment or end-to-end validation result. Auxiliary model endpoint lookup and platform authentication calls are omitted.</desc>
