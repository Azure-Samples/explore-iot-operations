<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="952" viewBox="0 0 1280 952"
     font-family="'Segoe UI', 'Segoe UI Web (West European)', -apple-system, 'Helvetica Neue', Arial, sans-serif"
     role="img" aria-labelledby="title description">
  <title id="title">AIO MCP and AI assistant: runtime architecture</title>
  <desc id="description">An operator outside the edge cluster uses authenticated kubectl exec, through the Kubernetes API, to ask questions, inspect tools, and approve or deny recommendations. Inside the agent Pod, the agent validates tool calls and holds publication for operator approval; a custom MQTT MCP sidecar handles broker access. The agent calls a Foundry Local Qwen text model and a separate custom Resource MCP service, which reads AIO Assets and Devices through the Kubernetes API. The AIO MQTT broker receives JSON from a separately deployed observation producer, delivers approved recommendations to a separately deployed consumer, and carries optional camera RPC to the ARM/AIO-managed ONVIF connector. That connector calls the sample's ONVIF camera simulator over SOAP and HTTP. The simulator uses a synthetic scene and is not automatically connected to the observation producer. Dashed outlines mark optional integrations; action tools are disabled by default. This is a source-defined runtime overview, not a live deployment or end-to-end validation result. Auxiliary endpoint-discovery and token-validation calls are omitted.</desc>
  <metadata>Hand-editable SVG. Source map and deployment ownership: ../docs/architecture.md. Azure Foundry and Fluent icon notices: THIRD-PARTY-NOTICES.md.</metadata>
