[package]
name = "edge-camera-actions"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
get-status = []
continuous-move = []
stop = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.38.0"
wasm_graph_sdk = { version = "=1.7.4", registry = "aio-wg" }

[profile.release]
lto = true
opt-level = 3
