apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${modelReaderRole}
  namespace: ${foundryNamespace}
  labels:
    app.kubernetes.io/part-of: aio-mcp-ai-assistant
rules:
  - apiGroups: [foundrylocal.azure.com]
    resources: [modeldeployments]
    resourceNames: ["${modelName}"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${modelReaderRole}
  namespace: ${foundryNamespace}
  labels:
    app.kubernetes.io/part-of: aio-mcp-ai-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${modelReaderRole}
subjects:
  - kind: ServiceAccount
    name: edge-assistant
    namespace: ${namespace}
