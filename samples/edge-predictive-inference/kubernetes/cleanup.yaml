apiVersion: batch/v1
kind: CronJob
metadata:
  name: edge-predictive-cleanup
  namespace: azure-iot-operations
  labels:
    app.kubernetes.io/part-of: edge-predictive-inference
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cleanup
              image: mcr.microsoft.com/azurelinux/busybox:1.36
              command: [/bin/sh, -ec]
              args:
                - |
                  find /data/edge-predictive-inference/inputs /data/edge-predictive-inference/responses \
                    -maxdepth 1 -type f -mmin +5 -print -delete
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 32Mi}
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: ${dataClaimName}
