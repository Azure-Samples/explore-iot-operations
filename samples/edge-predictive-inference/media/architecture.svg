  <text x="912" y="730" class="label">Foundry Local</text>
  <text x="872" y="758" class="detail">YOLOX-Nano / ONNX CPU</text>
  <text x="872" y="785" class="small">Raw output: [1,3549,85]</text>
  <path d="M1110,567 V698" class="other"/>
  <path d="M1134,698 V567" class="other"/>
  <text x="928" y="674" class="detail">HTTPS + SAT</text>
  <text x="928" y="692" class="small">Audience: aio-internal</text>

  <rect x="250" y="800" width="520" height="105" rx="4" class="card"/>
  <use href="#database-icon" x="270" y="816" width="28" height="28"/>
  <text x="310" y="835" class="label">Shared PVC: edge-predictive-data</text>
  <text x="274" y="859" class="detail">inputs/&lt;frameId&gt;.json</text>
  <text x="274" y="881" class="detail">responses/&lt;connector-reference&gt;</text>
  <text x="274" y="899" class="small">Scratch tensors only; age-based cleanup every minute</text>
  <path d="M275,530 H260 V770 H340 V800" class="files"/>
