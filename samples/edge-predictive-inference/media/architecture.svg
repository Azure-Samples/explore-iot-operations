  <text x="270" y="328" class="detail">snapshot-to-mqtt</text>
  <text x="270" y="352" class="small">JPEG, 0.2 snapshots/sec</text>
  <rect x="520" y="275" width="245" height="95" rx="4" class="card"/>
  <text x="540" y="302" class="label">MQTT broker</text>
  <text x="540" y="328" class="detail">Frames, results, errors</text>
  <text x="540" y="352" class="small">TLS + K8S-SAT</text>
