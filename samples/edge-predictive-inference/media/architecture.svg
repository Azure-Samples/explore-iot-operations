  <path d="M767,322 H988" class="mqtt"/>
  <text x="792" y="307" class="detail">JSON observations</text>

  <rect x="250" y="410" width="380" height="340" rx="6" fill="#DEECF9" stroke="#71AFE5"/>
  <text x="270" y="438" class="heading">Person-detection data flow</text>
  <text x="270" y="460" class="small">MQTT source + three transforms + sink</text>
  <rect x="275" y="480" width="330" height="65" rx="4" class="card"/>
  <text x="293" y="505" class="label">1. Prepare JPEG</text>
  <text x="293" y="530" class="small">BGR CHW tensor; [1,3,416,416]</text>
  <rect x="275" y="570" width="330" height="65" rx="4" class="card"/>
  <text x="293" y="595" class="label">2. Inference (Preview)</text>
  <text x="293" y="620" class="small">Microsoft graph 0.2 / fileRead=true</text>
  <rect x="275" y="660" width="330" height="65" rx="4" class="card"/>
  <text x="293" y="685" class="label">3. Decode person detections</text>
  <text x="293" y="710" class="small">Restore pixels; threshold + NMS</text>
  <path d="M440,547 V568" class="other"/>
  <path d="M440,637 V658" class="other"/>
  <path d="M575,372 V397 H240 V510 H273" class="mqtt"/>
