  <rect width="1280" height="1010" fill="#FFFFFF"/>
  <text x="24" y="34" class="title">Continuous person detection at the edge</text>
  <text x="24" y="60" class="detail">Media + native inference integration only: no camera control, viewer, text model or training pipeline.</text>

  <rect x="16" y="82" width="1248" height="102" rx="6" fill="#F3F2F1" stroke="#C8C6C4"/>
