<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010"
     font-family="'Segoe UI', 'Segoe UI Web (West European)', -apple-system, 'Helvetica Neue', Arial, sans-serif"
     role="img" aria-labelledby="title description">
  <title id="title">Continuous person detection with media and native inference connectors</title>
  <desc id="description">An RTSP camera feeds the media connector, which publishes JPEG snapshots through the MQTT broker to one five-node data flow graph. Its three transforms prepare an input tensor, invoke the native inference connector over broker-routed RPC, and decode the output. The connector calls Foundry Local over HTTPS with a service-account token. Prepared requests and raw responses share a scratch PVC. Observations return through the broker to a read-only result and file reader. ARM and Kubernetes own deployment; OCI supplies artifacts. The RPC link is shorthand for broker transport, detailed in the companion sequence.</desc>
