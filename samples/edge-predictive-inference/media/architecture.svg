  <text x="906" y="497" class="label">Native inference connector</text>
  <text x="872" y="525" class="detail">AIO Apps-managed; model-specific RPC</text>
  <text x="872" y="548" class="small">Reads requests; writes raw responses</text>
  <path d="M641,602 Q650,590 659,602" fill="none" stroke="#F3F8FD" stroke-width="7"/>
  <path d="M607,602 H641 Q650,590 659,602 H790 V515 H848" class="mqtt"/>
