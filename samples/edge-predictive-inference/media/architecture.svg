  <path d="M1230,340 H1248 V884 H770" class="files"/>
  <text x="1020" y="872" class="small">Read-only file retrieval</text>

  <path d="M24,960 H72" class="mqtt"/>
  <text x="84" y="965" class="small">MQTT; all RPC traffic traverses the broker</text>
  <path d="M445,960 H493" class="files"/>
  <text x="505" y="965" class="small">Shared-file access (labeled)</text>
  <path d="M820,960 H868" class="other"/>
  <text x="880" y="965" class="small">RTSP / HTTPS / in-process data</text>
  <text x="24" y="993" class="small">One sampled frame per attempt. No retained JPEG evidence, tracking, permanent result history, or safety decision.</text>
