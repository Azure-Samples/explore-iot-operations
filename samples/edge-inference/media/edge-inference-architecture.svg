<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"
     font-family="'Segoe UI', 'Segoe UI Web (West European)', -apple-system, 'Helvetica Neue', Arial, sans-serif"
     role="img" aria-labelledby="title description">
  <title id="title">Runtime architecture of the edge visual inspection sample</title>
  <desc id="description">Each scenario uses three data flow graphs: capture, inference, and postprocessing. MQTT topics and command RPCs pass through the Azure IoT Operations broker. The media connector buffers RTSP snapshots and copies selected JPEGs to a shared data volume. One inference connector reads JPEGs, calls the enabled Foundry Local models over authenticated HTTPS, and writes raw tensors. Postprocessing reads those tensors. The sample observer subscribes to all four stages, validates the result against the tensor and image, applies the review rule, writes records and evidence to a separate state volume, and publishes observations.</desc>
