apiVersion: batch/v1
kind: CronJob
metadata:
  name: edge-inference-response-cleanup
  namespace: azure-iot-operations
  labels:
    app.kubernetes.io/part-of: edge-inference-sample
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: edge-inference-sample
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ${IMAGE_PULL_SECRET}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: ${COLLECTOR_IMAGE}
              args: [clean-responses]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 100m, memory: 128Mi}
              volumeMounts:
                - name: responses
                  mountPath: /responses
                  subPath: edge-inference/responses
          volumes:
            - name: responses
              persistentVolumeClaim:
                claimName: ${DATA_CLAIM}
