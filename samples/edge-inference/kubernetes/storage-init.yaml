apiVersion: batch/v1
kind: Job
metadata:
  name: edge-inference-storage-init
  namespace: azure-iot-operations
  labels:
    app.kubernetes.io/part-of: edge-inference-sample
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: edge-inference-sample
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${IMAGE_PULL_SECRET}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare
          image: ${COLLECTOR_IMAGE}
          command: [python, -c]
          args:
            - |
              from pathlib import Path
              from tempfile import TemporaryFile
              for name in ("media/recordings", "responses"):
                  folder = Path("/data/edge-inference") / name
                  folder.mkdir(parents=True, exist_ok=True)
                  with TemporaryFile(dir=folder) as check:
                      check.write(b"storage-check")
              with TemporaryFile(dir="/state") as check:
                  check.write(b"state-check")
              print("Sample directories are writable as uid/gid 65532")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: state
              mountPath: /state
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${DATA_CLAIM}
        - name: state
          persistentVolumeClaim:
            claimName: ${STATE_CLAIM}
